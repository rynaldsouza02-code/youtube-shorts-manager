<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoShorts - AI YouTube Shorts Manager</title>
    <!-- Modern Typography: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      @keyframes zoomInLogo {
        0% {
          transform: scale(0.2) rotate(-10deg);
          opacity: 0;
          filter: blur(10px);
        }
        55% {
          transform: scale(1.45) rotate(5deg);
          opacity: 1;
          filter: blur(0px);
        }
        78% {
          transform: scale(0.93) rotate(-1deg);
        }
        100% {
          transform: scale(1) rotate(0deg);
          opacity: 1;
        }
      }

      @keyframes fadeInText {
        to {
          opacity: 1;
          transform: translateY(0);
          filter: blur(0px);
        }
      }
    </style>
  </head>
  <body style="margin: 0; background-color: #05060b;">
    <!-- Static Instant Splash Screen -->
    <div id="splash-screen" style="position: fixed; inset: 0; background-color: #05060b; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999; transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); background-image: radial-gradient(circle at 50% 50%, rgba(255, 46, 85, 0.08) 0%, transparent 50%);">
      <div style="background-color: #ff2e55; width: 140px; height: 140px; border-radius: 32px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 40px rgba(255, 46, 85, 0.5), 0 0 80px rgba(255, 46, 85, 0.3); animation: zoomInLogo 1.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;">
        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 17a24.12 24.12 0 0 1 0-10 2 2 0 0 1 1.4-1.4 49.56 49.56 0 0 1 16.2 0A2 2 0 0 1 21.5 7a24.12 24.12 0 0 1 0 10 2 2 0 0 1-1.4 1.4 49.55 49.55 0 0 1-16.2 0A2 2 0 0 1 2.5 17"/><path d="m10 15 5-3-5-3z" fill="white"/></svg>
      </div>
      <h1 style="margin-top: 28px; font-family: 'Outfit', sans-serif; font-weight: 900; font-size: 2.3rem; letter-spacing: -0.03em; background: linear-gradient(135deg, #ff2e55 0%, #d946ef 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; color: #ff2e55; animation: fadeInText 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards; opacity: 0; transform: translateY(12px);">
        AutoShorts
      </h1>
      <p style="margin-top: 8px; font-family: 'Inter', sans-serif; font-size: 0.9rem; color: #94a3b8; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; animation: fadeInText 1s ease 0.6s forwards; opacity: 0; transform: translateY(12px);">
        AI Video Compiler
      </p>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
